<!DOCTYPE html>
<html lang="en">
  <head>
    <title>WebGL Shadow Mapping</title>
    
    <script type="text/javascript" src="glMatrix-0.9.5.min.js"></script>
    <script type="text/javascript" src="script.js"></script>

    <style>
      :root {
        --bg-color: #1a1b1e;
        --card-color: #252629;
        --primary-color: #3b82f6;
        --text-color: #e2e8f0;
        --text-secondary: #94a3b8;
        --border-color: #333538;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:'Helvetica Neue', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 2rem;
      }

      h1 {
        font-weight: 500;
        font-size: 2.25rem;
        color: white;
        margin-bottom: 2rem;
        text-align: center;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      #canvas {
        background-color: #000;
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        display: block;
      }

      .controls {
        background-color: var(--card-color);
        border: 1px solid var(--border-color);
        border-radius: 0.75rem;
        padding: 1.5rem 2rem;
        width: 100%;
        max-width: 512px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .control-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .control-group label {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-secondary);
      }
      
      input[type="range"] {
        appearance: none;
        width: 250px;
        height: 8px;
        background: var(--border-color);
        border-radius: 5px;
        outline: none;
        opacity: 0.7;
        transition: opacity 0.2s;
      }

    </style>
  </head>
  <head>
  <body onload="webGLStart();">

    <div class="container">
      <canvas
        id="canvas"
        width="800"
        height="800"
      ></canvas>

      <div class="controls">
        <div class="control-group">
          <label for="slider">Light Z-Position:</label>
          <input
            type="range"
            id="slider"
            min="-10"
            max="10"
            value="0" 
            step="0.1"
            oninput="updateSlider(this.value)"
          />
        </div>

        <div class="control-group">
          <label for="tick">Toggle Animation:</label>
          <input
            type="checkbox"
            id="tick"
            onclick="toggleAnimation()"
          />
        </div>
      </div>
    </div>
    
  </body>
</html>
